<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civic Compass - Leadership Assessment</title>
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .card h2 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 1.5em;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .candidate-input {
      margin-bottom: 25px;
      padding: 20px;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      border-radius: 10px;
    }

    .candidate-input label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #667eea;
      font-size: 1.1em;
    }

    .candidate-input input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #667eea;
      border-radius: 8px;
      font-size: 1em;
      transition: all 0.3s ease;
    }

    .candidate-input input[type="text"]:focus {
      outline: none;
      border-color: #764ba2;
      box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
    }

    .input-group {
      display: grid;
      gap: 15px;
      margin-bottom: 15px;
    }

    .input-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-item label {
      font-weight: 600;
      color: #555;
      font-size: 0.95em;
    }

    .input-item .axis-description {
      font-size: 0.85em;
      color: #777;
      font-style: italic;
      margin-top: -5px;
    }

    .input-item input[type="range"] {
      width: 100%;
      height: 8px;
      border-radius: 5px;
      background: #ddd;
      outline: none;
      -webkit-appearance: none;
    }

    .input-item input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #667eea;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .input-item input[type="range"]::-webkit-slider-thumb:hover {
      background: #764ba2;
      transform: scale(1.2);
    }

    .input-item input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #667eea;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
    }

    .input-item input[type="range"]::-moz-range-thumb:hover {
      background: #764ba2;
      transform: scale(1.2);
    }

    .value-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .value-display span {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: bold;
      min-width: 45px;
      text-align: center;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f5f7fa;
      color: #667eea;
      border: 2px solid #667eea;
    }

    .btn-secondary:hover {
      background: #667eea;
      color: white;
    }

    .chart-container {
      position: relative;
      height: 500px;
      margin: 20px 0;
    }

    @media (max-width: 968px) {
      .main-content {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 2em;
      }

      .chart-container {
        height: 400px;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 15px;
      }

      .header h1 {
        font-size: 1.5em;
      }

      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧭 Civic Compass</h1>
      <p>Leadership Assessment Tool - Evaluate and visualize leadership competencies</p>
    </div>

    <div class="main-content">
      <!-- Input Controls -->
      <div class="card">
        <h2>Leadership Assessment</h2>
        
        <div class="candidate-input">
          <label for="candidate-name">Candidate Name:</label>
          <input type="text" id="candidate-name" placeholder="Enter candidate name" />
        </div>

        <div class="input-group" id="input-group">
          <!-- Dynamic inputs will be inserted here -->
        </div>

        <div class="button-group">
          <button class="btn-secondary" id="reset-btn">Reset Values</button>
          <button class="btn-primary" id="download-btn">Download Chart</button>
        </div>
      </div>

      <!-- Chart Display -->
      <div class="card">
        <h2 id="chart-title">Leadership Radar Chart</h2>
        <div class="chart-container">
          <canvas id="radarChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Leadership axes definition
    const LEADERSHIP_AXES = [
      {
        name: 'Vision & Strategic Thinking',
        description: 'Ability to set long-term vision and strategic direction',
        default: 50
      },
      {
        name: 'Emotional Intelligence',
        description: 'Understanding and managing emotions effectively',
        default: 50
      },
      {
        name: 'Communication Skills',
        description: 'Clear and effective communication with stakeholders',
        default: 50
      },
      {
        name: 'Decision Making',
        description: 'Making sound decisions under pressure',
        default: 50
      },
      {
        name: 'Integrity & Ethics',
        description: 'Maintaining ethical standards and trustworthiness',
        default: 50
      },
      {
        name: 'Innovation & Adaptability',
        description: 'Embracing change and fostering innovation',
        default: 50
      }
    ];

    // State management
    let chartData = LEADERSHIP_AXES.map(axis => axis.default);
    let radarChart;

    // Initialize the application
    function init() {
      createInputControls();
      createChart();
      attachEventListeners();
      updateChartTitle();
    }

    // Create input controls for each axis
    function createInputControls() {
      const inputGroup = document.getElementById('input-group');
      
      LEADERSHIP_AXES.forEach((axis, index) => {
        const inputItem = document.createElement('div');
        inputItem.className = 'input-item';
        
        inputItem.innerHTML = `
          <div class="value-display">
            <label>${axis.name}</label>
            <span id="value-${index}">${axis.default}</span>
          </div>
          <div class="axis-description">${axis.description}</div>
          <input 
            type="range" 
            id="axis-${index}" 
            min="0" 
            max="100" 
            value="${axis.default}"
            data-index="${index}"
          />
        `;
        
        inputGroup.appendChild(inputItem);
      });
    }

    // Create the radar chart
    function createChart() {
      const ctx = document.getElementById('radarChart').getContext('2d');
      
      radarChart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: LEADERSHIP_AXES.map(axis => axis.name),
          datasets: [{
            label: 'Leadership Assessment',
            data: chartData,
            backgroundColor: 'rgba(102, 126, 234, 0.2)',
            borderColor: 'rgba(102, 126, 234, 1)',
            borderWidth: 2,
            pointBackgroundColor: 'rgba(118, 75, 162, 1)',
            pointBorderColor: '#fff',
            pointHoverBackgroundColor: '#fff',
            pointHoverBorderColor: 'rgba(118, 75, 162, 1)',
            pointRadius: 5,
            pointHoverRadius: 7
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: {
              beginAtZero: true,
              min: 0,
              max: 100,
              ticks: {
                stepSize: 20,
                font: {
                  size: 12
                }
              },
              pointLabels: {
                font: {
                  size: 11,
                  weight: 'bold'
                },
                color: '#555'
              },
              grid: {
                color: 'rgba(0, 0, 0, 0.1)'
              },
              angleLines: {
                color: 'rgba(0, 0, 0, 0.1)'
              }
            }
          },
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: {
                font: {
                  size: 14,
                  weight: 'bold'
                },
                color: '#667eea'
              }
            },
            tooltip: {
              enabled: true,
              backgroundColor: 'rgba(0, 0, 0, 0.8)',
              titleFont: {
                size: 14,
                weight: 'bold'
              },
              bodyFont: {
                size: 13
              },
              padding: 12,
              cornerRadius: 8,
              callbacks: {
                label: function(context) {
                  return context.dataset.label + ': ' + context.parsed.r + '/100';
                }
              }
            }
          }
        }
      });
    }

    // Update chart with new data
    function updateChart() {
      radarChart.data.datasets[0].data = chartData;
      radarChart.update();
    }

    // Update chart title with candidate name
    function updateChartTitle() {
      const candidateName = document.getElementById('candidate-name').value.trim();
      const chartTitle = document.getElementById('chart-title');
      
      if (candidateName) {
        chartTitle.textContent = `Leadership Radar Chart - ${candidateName}`;
        radarChart.data.datasets[0].label = candidateName;
      } else {
        chartTitle.textContent = 'Leadership Radar Chart';
        radarChart.data.datasets[0].label = 'Leadership Assessment';
      }
      
      radarChart.update();
    }

    // Attach event listeners
    function attachEventListeners() {
      // Range input listeners
      LEADERSHIP_AXES.forEach((axis, index) => {
        const rangeInput = document.getElementById(`axis-${index}`);
        const valueDisplay = document.getElementById(`value-${index}`);
        
        rangeInput.addEventListener('input', (e) => {
          const value = parseInt(e.target.value);
          chartData[index] = value;
          valueDisplay.textContent = value;
          updateChart();
        });
      });

      // Candidate name input listener
      document.getElementById('candidate-name').addEventListener('input', updateChartTitle);

      // Reset button
      document.getElementById('reset-btn').addEventListener('click', () => {
        LEADERSHIP_AXES.forEach((axis, index) => {
          const rangeInput = document.getElementById(`axis-${index}`);
          const valueDisplay = document.getElementById(`value-${index}`);
          
          rangeInput.value = axis.default;
          valueDisplay.textContent = axis.default;
          chartData[index] = axis.default;
        });
        
        updateChart();
      });

      // Download button
      document.getElementById('download-btn').addEventListener('click', () => {
        const candidateName = document.getElementById('candidate-name').value.trim() || 'unnamed';
        const filename = `civic-compass-${candidateName}.png`;
        
        // Convert chart to image
        const url = radarChart.toBase64Image();
        
        // Create download link
        const link = document.createElement('a');
        link.download = filename;
        link.href = url;
        link.click();
      });
    }

    // Initialize the application when DOM is ready
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
